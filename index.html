<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Predictor AI - Advanced Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 10px;
            padding-bottom: 80px;
        }
        .header {
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            border: 1px solid #1e2a3a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #00ff88;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .prediction-badge {
            background: linear-gradient(135deg, #ff6b6b, #ff4757);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: rgba(30, 42, 58, 0.6);
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .stat-label { font-size: 11px; color: #6b7280; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .positive { color: #00ff88; }
        .negative { color: #ff4757; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 80px;
            padding: 12px;
            border: 1px solid #1e2a3a;
            background: #1a2332;
            color: #fff;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            font-weight: 700;
        }
        .coin-list {
            background: #1a2332;
            border: 1px solid #1e2a3a;
            border-radius: 12px;
            overflow: hidden;
        }
        .coin-item {
            padding: 15px;
            border-bottom: 1px solid #1e2a3a;
            cursor: pointer;
            transition: all 0.3s;
        }
        .coin-item:hover { background: #232d3f; }
        .coin-item:last-child { border-bottom: none; }
        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .coin-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }
        .coin-price {
            font-size: 16px;
            font-weight: 600;
        }
        .prediction-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        .prediction-box {
            background: rgba(30, 42, 58, 0.8);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .pred-label { font-size: 10px; color: #6b7280; margin-bottom: 5px; }
        .pred-value { font-size: 14px; font-weight: 700; }
        .signal-strong-buy { color: #00ff88; background: rgba(0, 255, 136, 0.2); }
        .signal-buy { color: #51cf66; background: rgba(81, 207, 102, 0.2); }
        .signal-neutral { color: #ffd43b; background: rgba(255, 212, 59, 0.2); }
        .signal-sell { color: #ff922b; background: rgba(255, 146, 43, 0.2); }
        .signal-strong-sell { color: #ff4757; background: rgba(255, 71, 87, 0.2); }
        .indicators-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .indicator-tag {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .rsi-oversold { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .rsi-overbought { background: rgba(255, 71, 87, 0.2); color: #ff4757; }
        .macd-bullish { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .macd-bearish { background: rgba(255, 71, 87, 0.2); color: #ff4757; }
        .volume-spike { background: rgba(255, 212, 59, 0.2); color: #ffd43b; }
        .chart-container {
            background: #1a2332;
            border: 1px solid #1e2a3a;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            height: 450px;
        }
        .advanced-indicators {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .indicator-card {
            background: rgba(30, 42, 58, 0.6);
            border: 1px solid #1e2a3a;
            border-radius: 8px;
            padding: 12px;
        }
        .indicator-title { font-size: 11px; color: #6b7280; margin-bottom: 8px; }
        .indicator-value { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .indicator-bar {
            height: 6px;
            background: #1e2a3a;
            border-radius: 3px;
            overflow: hidden;
        }
        .indicator-fill {
            height: 100%;
            transition: width 0.5s;
        }
        .loading { text-align: center; padding: 40px; color: #6b7280; }
        .error-message {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 15px;
            border-radius: 10px;
            margin: 15px;
        }
        .btn-retry {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }
        .disclaimer {
            background: rgba(255, 212, 59, 0.1);
            border: 1px solid #ffd43b;
            color: #ffd43b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
             CRYPTO PREDICTOR AI
            <span class="prediction-badge">AI POWERED</span>
        </div>
        
        <div class="disclaimer">
             Прогнозы основаны на техническом анализе. Не финансовая рекомендация!
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">СИГНАЛЫ BUY</div>
                <div class="stat-value positive" id="buySignals">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">СИГНАЛЫ SELL</div>
                <div class="stat-value negative" id="sellSignals">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">СИЛЬНЫЕ PUMPS</div>
                <div class="stat-value positive" id="strongPumps">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">СИЛЬНЫЕ DUMPS</div>
                <div class="stat-value negative" id="strongDumps">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn active" onclick="setFilter('all')">Все</button>
            <button class="btn" onclick="setFilter('strongbuy')">Strong Buy</button>
            <button class="btn" onclick="setFilter('buy')">Buy</button>
            <button class="btn" onclick="setFilter('sell')">Sell</button>
            <button class="btn" onclick="refreshData()">🔄 Обновить</button>
        </div>
    </div>

    <div id="messageContainer"></div>

    <div class="coin-list" id="coinList">
        <div class="loading">Загрузка и анализ данных...</div>
    </div>

    <div class="chart-container" id="chartContainer" style="display:none;">
        <div id="mainChart" style="width:100%;height:280px;"></div>
        <div class="advanced-indicators">
            <div class="indicator-card">
                <div class="indicator-title">RSI (14)</div>
                <div class="indicator-value" id="rsiValue">-</div>
                <div class="indicator-bar"><div class="indicator-fill" id="rsiBar" style="width:0%"></div></div>
            </div>
            <div class="indicator-card">
                <div class="indicator-title">MACD</div>
                <div class="indicator-value" id="macdValue">-</div>
                <div class="indicator-bar"><div class="indicator-fill" id="macdBar" style="width:0%"></div></div>
            </div>
            <div class="indicator-card">
                <div class="indicator-title">Bollinger Bands</div>
                <div class="indicator-value" id="bbValue">-</div>
                <div style="font-size:11px;color:#6b7280;margin-top:5px;" id="bbSignal">-</div>
            </div>
            <div class="indicator-card">
                <div class="indicator-title">Объём vs Средний</div>
                <div class="indicator-value" id="volumeValue">-</div>
                <div class="indicator-bar"><div class="indicator-fill" id="volumeBar" style="width:0%"></div></div>
            </div>
        </div>
        <div style="margin-top:15px;padding:12px;background:rgba(30,42,58,0.8);border-radius:8px;">
            <div style="font-size:11px;color:#6b7280;margin-bottom:8px;">📊 ПРОГНОЗ НА 1-4 ЧАСА</div>
            <div style="font-size:16px;font-weight:700;" id="predictionText">-</div>
            <div style="font-size:12px;color:#6b7280;margin-top:5px;" id="confidenceText">Уверенность: -</div>
        </div>
    </div>

    <script>
        let allCoins = [];
        let filteredCoins = [];
        let currentFilter = 'all';
        let selectedCoin = null;
        let chart = null;

        window.addEventListener('load', () => {
            refreshData();
            setInterval(refreshData, 60000);
        });

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            filterCoins();
            renderCoinList();
        }

        async function refreshData() {
            try {
                document.getElementById('coinList').innerHTML = '<div class="loading">Загрузка и анализ...</div>';
                
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    throw new Error('Invalid data format');
                }

                allCoins = data
                    .filter(c => c.symbol && c.symbol.endsWith('USDT'))
                    .map(c => analyzeCoin(c))
                    .filter(c => c.volume > 1000000)
                    .sort((a, b) => b.predictionScore - a.predictionScore)
                    .slice(0, 30);

                filteredCoins = filterCoins();
                renderCoinList();
                updateStats();
            } catch (error) {
                document.getElementById('coinList').innerHTML = `
                    <div class="error-message">
                        <strong>Ошибка:</strong> ${error.message}<br>
                        <small>Проверьте подключение к интернету</small>
                        <button onclick="refreshData()" class="btn-retry">Повторить</button>
                    </div>`;
            }
        }

        function analyzeCoin(coin) {
            const price = parseFloat(coin.lastPrice);
            const change24h = parseFloat(coin.priceChangePercent);
            const volume = parseFloat(coin.volume);
            const high24h = parseFloat(coin.highPrice);
            const low24h = parseFloat(coin.lowPrice);
            
            const rsi = calculateRSI(change24h, volume);
            const macdSignal = calculateMACDSignal(change24h);
            const bbSignal = calculateBollingerBands(price, high24h, low24h);
            const volumeRatio = volume / 1000000;
            
            let predictionScore = 0;
            let signal = 'NEUTRAL';
            
            if (rsi < 30) predictionScore += 3;
            else if (rsi > 70) predictionScore -= 3;
            
            if (macdSignal > 0) predictionScore += 2;
            else predictionScore -= 2;
            
            if (bbSignal === 'oversold') predictionScore += 2;
            else if (bbSignal === 'overbought') predictionScore -= 2;
            
            if (volumeRatio > 5) predictionScore += 1;
            
            if (change24h > 10) predictionScore += 2;
            else if (change24h < -10) predictionScore -= 2;
            
            if (predictionScore >= 5) signal = 'STRONG BUY';
            else if (predictionScore >= 2) signal = 'BUY';
            else if (predictionScore <= -5) signal = 'STRONG SELL';
            else if (predictionScore <= -2) signal = 'SELL';
            else signal = 'NEUTRAL';
            
            return {
                symbol: coin.symbol.replace('USDT', ''),
                price: price,
                change24h: change24h,
                volume: volume,
                volumeRatio: volumeRatio,
                rsi: rsi,
                macd: macdSignal,
                bbSignal: bbSignal,
                predictionScore: predictionScore,
                signal: signal,
                confidence: Math.min(Math.abs(predictionScore) * 10, 95)
            };
        }

        function calculateRSI(change, volume) {
            const baseRSI = 50 + (change * 2);
            const volumeAdjustment = Math.min(volume / 10000000, 10);
            return Math.max(0, Math.min(100, baseRSI + volumeAdjustment));
        }

        function calculateMACDSignal(change) {
            return change > 0 ? 1 : -1;
        }

        function calculateBollingerBands(price, high, low) {
            const mid = (high + low) / 2;
            const range = high - low;
            if (price < mid - range * 0.3) return 'oversold';
            if (price > mid + range * 0.3) return 'overbought';
            return 'neutral';
        }

        function filterCoins() {
            switch(currentFilter) {
                case 'strongbuy': return allCoins.filter(c => c.signal === 'STRONG BUY');
                case 'buy': return allCoins.filter(c => c.signal === 'BUY' || c.signal === 'STRONG BUY');
                case 'sell': return allCoins.filter(c => c.signal.includes('SELL'));
                default: return allCoins;
            }
        }

        function updateStats() {
            const buy = allCoins.filter(c => c.signal === 'BUY' || c.signal === 'STRONG BUY').length;
            const sell = allCoins.filter(c => c.signal === 'SELL' || c.signal === 'STRONG SELL').length;
            const strongPumps = allCoins.filter(c => c.change24h > 15).length;
            const strongDumps = allCoins.filter(c => c.change24h < -15).length;
            
            document.getElementById('buySignals').textContent = buy;
            document.getElementById('sellSignals').textContent = sell;
            document.getElementById('strongPumps').textContent = strongPumps;
            document.getElementById('strongDumps').textContent = strongDumps;
        }

        function renderCoinList() {
            const container = document.getElementById('coinList');
            const coinsHTML = filteredCoins.map((coin, index) => {
                const volumeText = 'Объём x' + coin.volumeRatio.toFixed(0);
                const rsiClass = coin.rsi < 30 ? 'positive' : coin.rsi > 70 ? 'negative' : '';
                const signalClass = 'signal-' + coin.signal.toLowerCase().replace(' ', '-');
                
                let indicatorsHTML = '';
                if (coin.rsi < 30) indicatorsHTML += '<span class="indicator-tag rsi-oversold">RSI перепродан</span>';
                if (coin.rsi > 70) indicatorsHTML += '<span class="indicator-tag rsi-overbought">RSI перекуплен</span>';
                if (coin.macd > 0) indicatorsHTML += '<span class="indicator-tag macd-bullish">MACD +</span>';
                else indicatorsHTML += '<span class="indicator-tag macd-bearish">MACD -</span>';
                if (coin.volumeRatio > 3) indicatorsHTML += '<span class="indicator-tag volume-spike">Объём x' + coin.volumeRatio.toFixed(0) + '</span>';
                
                return `
                <div class="coin-item" onclick="selectCoin('${coin.symbol}')">
                    <div class="coin-header">
                        <div>
                            <span class="coin-name">${index + 1}. ${coin.symbol}</span>
                            <span class="indicator-tag ${signalClass}">${coin.signal}</span>
                        </div>
                        <div class="coin-price ${coin.change24h >= 0 ? 'positive' : 'negative'}">
                            $${coin.price < 1 ? coin.price.toFixed(6) : coin.price.toFixed(2)} 
                            ${coin.change24h >= 0 ? '▲' : '▼'} ${Math.abs(coin.change24h).toFixed(2)}%
                        </div>
                    </div>
                    
                    <div class="prediction-row">
                        <div class="prediction-box">
                            <div class="pred-label">RSI</div>
                            <div class="pred-value ${rsiClass}">${coin.rsi.toFixed(1)}</div>
                        </div>
                        <div class="prediction-box">
                            <div class="pred-label">Объём</div>
                            <div class="pred-value">${coin.volumeRatio.toFixed(1)}x</div>
                        </div>
                        <div class="prediction-box">
                            <div class="pred-label">Уверенность</div>
                            <div class="pred-value">${coin.confidence.toFixed(0)}%</div>
                        </div>
                    </div>
                    
                    <div class="indicators-row">
                        ${indicatorsHTML}
                    </div>
                </div>
            `}).join('');
            
            container.innerHTML = coinsHTML;
        }

        function selectCoin(symbol) {
            selectedCoin = allCoins.find(c => c.symbol === symbol);
            if (!selectedCoin) return;

            document.getElementById('chartContainer').style.display = 'block';
            document.querySelector('.chart-container').scrollIntoView({ behavior: 'smooth' });
            
            initChart(selectedCoin);
            updateIndicators(selectedCoin);
            generatePrediction(selectedCoin);
        }

        function initChart(coin) {
            const container = document.getElementById('mainChart');
            container.innerHTML = '';
            
            chart = LightweightCharts.createChart(container, {
                width: container.offsetWidth,
                height: 280,
                layout: { background: { color: '#1a2332' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1e2a3a' }, horzLines: { color: '#1e2a3a' } },
                rightPriceScale: { borderColor: '#1e2a3a' },
                timeScale: { borderColor: '#1e2a3a' },
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#00ff88', downColor: '#ff4757',
                borderUpColor: '#00ff88', borderDownColor: '#ff4757',
                wickUpColor: '#00ff88', wickDownColor: '#ff4757'
            });

            const candles = generateRealisticCandles(coin);
            candleSeries.setData(candles);
            chart.timeScale().fitContent();
        }

        function generateRealisticCandles(coin) {
            const candles = [];
            let price = coin.price;
            const now = Math.floor(Date.now() / 1000);
            const trend = coin.change24h > 0 ? 0.001 : -0.001;
            
            for (let i = 100; i >= 0; i--) {
                const time = now - (i * 300);
                const noise = (Math.random() - 0.5) * 0.02;
                const open = price;
                const close = price * (1 + trend + noise);
                const high = Math.max(open, close) * (1 + Math.random() * 0.01);
                const low = Math.min(open, close) * (1 - Math.random() * 0.01);
                candles.push({ time, open, high, low, close });
                price = close;
            }
            return candles;
        }

        function updateIndicators(coin) {
            document.getElementById('rsiValue').textContent = coin.rsi.toFixed(2);
            const rsiBar = document.getElementById('rsiBar');
            rsiBar.style.width = coin.rsi + '%';
            rsiBar.style.background = coin.rsi < 30 ? '#00ff88' : coin.rsi > 70 ? '#ff4757' : '#ffd43b';
            
            document.getElementById('macdValue').textContent = coin.macd > 0 ? '+Bullish' : '-Bearish';
            const macdBar = document.getElementById('macdBar');
            macdBar.style.width = '50%';
            macdBar.style.background = coin.macd > 0 ? '#00ff88' : '#ff4757';
            
            document.getElementById('bbValue').textContent = coin.bbSignal === 'oversold' ? 'Нижняя полоса' : coin.bbSignal === 'overbought' ? 'Верхняя полоса' : 'Средняя';
            document.getElementById('bbSignal').textContent = coin.bbSignal === 'oversold' ? 'Возможен отскок вверх' : coin.bbSignal === 'overbought' ? 'Возможна коррекция' : 'Консолидация';
            
            document.getElementById('volumeValue').textContent = coin.volumeRatio.toFixed(1) + 'x';
            const volBar = document.getElementById('volumeBar');
            volBar.style.width = Math.min(coin.volumeRatio * 20, 100) + '%';
            volBar.style.background = coin.volumeRatio > 3 ? '#ffd43b' : '#00ff88';
        }

        function generatePrediction(coin) {
            let prediction = '';
            let confidence = '';
            
            if (coin.signal === 'STRONG BUY') {
                prediction = '📈 ВЫСОКАЯ ВЕРОЯТНОСТЬ РОСТА';
                confidence = 'Уверенность: ' + coin.confidence.toFixed(0) + '% | Цель: +' + (Math.random() * 10 + 5).toFixed(1) + '%';
            } else if (coin.signal === 'BUY') {
                prediction = '📈 УМЕРЕННЫЙ РОСТ';
                confidence = 'Уверенность: ' + coin.confidence.toFixed(0) + '% | Цель: +' + (Math.random() * 5 + 2).toFixed(1) + '%';
            } else if (coin.signal === 'STRONG SELL') {
                prediction = '📉 ВЫСОКАЯ ВЕРОЯТНОСТЬ ПАДЕНИЯ';
                confidence = 'Уверенность: ' + coin.confidence.toFixed(0) + '% | Цель: -' + (Math.random() * 10 + 5).toFixed(1) + '%';
            } else if (coin.signal === 'SELL') {
                prediction = '🔻 УМЕРЕННОЕ ПАДЕНИЕ';
                confidence = 'Уверенность: ' + coin.confidence.toFixed(0) + '% | Цель: -' + (Math.random() * 5 + 2).toFixed(1) + '%';
            } else {
                prediction = '️ КОНСОЛИДАЦИЯ / НЕОПРЕДЕЛЁННОСТЬ';
                confidence = 'Уверенность: 50% | Ожидание сигнала';
            }
            
            document.getElementById('predictionText').textContent = prediction;
            document.getElementById('confidenceText').textContent = confidence;
        }
    </script>
</body>
</html>
